name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Lockfile aktuell
        run: uv lock --check

      - name: Holdout unverändert seit Commit vor dem ersten Code
        run: cd holdout && grep -v '^#' ../holdout.sha256 | sha256sum -c -

      - name: Datenhygiene (nur *.example-Adressen, keine Home-Pfade)
        run: |
          bad=$(git grep -h -o -I -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . ':!uv.lock' \
            | grep -v -E '\.example$|noreply@anthropic\.com$|users\.noreply\.github\.com$' | sort -u || true)
          paths=$(git grep -n -I -E '/(Users|home)/[a-z]' -- . ':!uv.lock' || true)
          if [ -n "$bad$paths" ]; then echo "$bad"; echo "$paths"; exit 1; fi

      # CPU-Torch statt der CUDA-Wheels aus dem Lockfile: spart mehrere GB Download
      - name: Abhängigkeiten
        run: |
          uv venv --python 3.12
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . pytest httpx

      - name: Tests (schnelle Suite)
        run: .venv/bin/pytest -q
