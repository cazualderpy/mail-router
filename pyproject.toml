[project]
name = "mail-router"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "langchain-ollama",
    "langchain-core",
    "faker",
    "accelerate",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_router"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts ="-m 'not slow'"
markers = ["slow: langsame Tests (Modelle, Training)"]
