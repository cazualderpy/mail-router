[project]
name = "mail-router"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "langchain-ollama",
    "langchain-core",
    "faker",
    "accelerate",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_router"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts ="-m 'not slow'"
markers = ["slow: langsame Tests (Modelle, Training)"]

[tool.ruff]
line-length = 120
extend-exclude = ["holdout"]  # unverändert lassen, Hashes in holdout.sha256

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # lange Phrasen im Datengenerator
