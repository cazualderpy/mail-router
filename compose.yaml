name: mail-router

# backend ist intern: keine Route ins Internet. Nur das gateway sitzt zusätzlich im edge-Netz.
networks:
  backend:
    internal: true
  edge: {}

volumes:
  ollama: {}

services:
  ollama:
    image: ollama/ollama:latest
    networks: [backend]
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    restart: unless-stopped

  api:
    build: .
    networks: [backend]
    depends_on: [ollama]
    volumes:
      - ./models/classifier:/app/models/classifier:ro
    environment:
      CLASSIFIER_PATH: /app/models/classifier
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    networks: [backend, edge]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Nur für das Setup (Modell-Download): Internet über edge, kein Zugriff auf Mail-Daten.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [setup]
    networks: [edge]
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull qwen2.5:3b
